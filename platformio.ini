; Capteur de veille — XIAO ESP32-C6
; Trois environnements (SPEC § Protocole de test et de flash) :
;   native : tests unitaires de la logique pure (pio test -e native)
;   test   : LED, logs BLE, constantes courtes ; CDC USB désactivé
;   prod   : ni LED ni BLE, constantes de production ; CDC USB désactivé
;
; Builds validés le 2026-10-08 (voir docs/DECISIONS.md) avec la plateforme
; pioarduino « stable » résolue en espressif32 55.3.312, Arduino 3.3.12,
; ESP-IDF 5.5.5. URL non encore figée : le nom exact de la release
; correspondante reste à confirmer avant de remplacer « stable ».

[platformio]
default_envs = test

[env]
test_framework = unity

; Base commune aux deux cibles matérielles
[esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
; CDC USB désactivé : aucune conclusion sur le sommeil ne se tire d'un
; build CDC actif. Les drapeaux éventuels de la carte sont retirés puis
; forcés à 0.
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLOW_BATTERY_MV=3500
build_src_filter = +<*>

[env:native]
platform = native
; Seule la logique pure est compilée ; aucune dépendance matérielle.
build_src_filter = -<*> +<logic/>
test_build_src = yes
build_flags =
    -std=gnu++17
    -DENV_NATIVE=1

[env:test]
extends = esp32c6
build_flags =
    ${esp32c6.build_flags}
    -DENV_TEST=1
    -DWITH_LED=1
    -DWITH_BLE=1
    ; Constantes courtes du test rapide (SPEC § Protocole de test)
    -DHEARTBEAT_S=120
    -DFILTER_WINDOW_S=30

[env:prod]
extends = esp32c6
build_flags =
    ${esp32c6.build_flags}
    -DENV_PROD=1
    -DWITH_LED=0
    -DWITH_BLE=0
    ; Constantes de production : à fixer au ticket 09 d'après
    ; SPEC § Horloge, filtre et heartbeats.
